<style>
    .version-menu {
        display: none;
        margin-top: 16px;
        background: #070b12;
        border: 1px solid var(--border-color);
        border-radius: 8px;
        overflow: hidden;
    }
    .version-header {
        padding: 12px;
        cursor: pointer;
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: #111827;
        font-size: 13px;
        font-weight: 600;
        color: var(--accent-cyan);
    }
    .version-body {
        padding: 12px;
        font-size: 12px;
        color: var(--text-secondary);
        display: none;
        white-space: pre-line;
        border-top: 1px solid var(--border-color);
    }
</style>

<div class="version-menu" id="versionMenu">
    <div class="version-header" onclick="toggleDetails()">
        <span id="vTitle">Sürüm Bilgileri Yükleniyor...</span>
        <span>▼</span>
    </div>
    <div class="version-body" id="vBody"></div>
</div>

<script>
    // ... (Önceki JS fonksiyonlarını koru) ...

    function toggleDetails() {
        const b = document.getElementById('vBody');
        b.style.display = (b.style.display === 'block') ? 'none' : 'block';
    }

    async function onFileSelect() {
        const inp = document.getElementById('fileInp');
        if(inp.files.length > 0) {
            file = inp.files[0];
            document.getElementById('fileTxt').innerText = `${file.name} [${Math.round(file.size/1024)} KB]`;
            
            // Pastebin RAW linki (JSON'ı buraya bağla)
            const pastebinRawUrl = "https://pastebin.com/raw/SENIN_PASTE_IDN"; 
            
            try {
                const response = await fetch(pastebinRawUrl);
                const data = await response.json();
                
                document.getElementById('vTitle').innerText = data.Guncelleme_Baslik;
                document.getElementById('vBody').innerText = data.Guncelleme_Detay;
                document.getElementById('versionMenu').style.display = 'block';
            } catch (e) {
                console.error("Sürüm notları yüklenemedi", e);
            }

            if(device) document.getElementById('upBtn').style.display = 'block';
        }
    }
</script>
