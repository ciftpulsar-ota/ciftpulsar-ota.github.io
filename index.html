<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ÇİFT PULSAR v2 // Ota Control Terminal</title>
    <style>
        :root {
            --bg-main: #090d16;
            --bg-panel: #111827;
            --border-color: #1f2937;
            --border-focus: #3b82f6;
            --text-primary: #f3f4f6;
            --text-secondary: #9ca3af;
            --text-muted: #6b7280;
            --accent-cyan: #06b6d4;
            --success: #10b981;
        }

        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: var(--bg-main); color: var(--text-primary); margin: 0; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; box-sizing: border-box; }
        .terminal-container { background: var(--bg-panel); border: 1px solid var(--border-color); border-radius: 12px; padding: 32px; width: 100%; max-width: 480px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.3); }
        .logo-wrapper { width: 100%; margin-bottom: 24px; display: flex; justify-content: center; }
        .logo-wrapper img { width: 100%; max-height: 120px; object-fit: contain; }
        .header-group { text-align: center; margin-bottom: 28px; }
        h1 { font-size: 20px; margin: 0 0 6px 0; }
        .subtitle { font-size: 13px; color: var(--text-secondary); }
        
        .btn { display: block; width: 100%; padding: 14px; background: #1f2937; border: 1px solid var(--border-color); color: var(--text-primary); border-radius: 8px; cursor: pointer; text-align: center; margin-bottom: 15px; }
        .btn-trigger { background: #2563eb; color: #ffffff; border: none; }
        .btn.connected { background: rgba(16, 185, 129, 0.15); color: var(--success); }
        
        .drop-zone { border: 1px dashed var(--border-color); background: #030712; padding: 24px; border-radius: 8px; text-align: center; cursor: pointer; margin: 16px 0; }
        
        .version-menu { display: none; margin-bottom: 20px; background: #070b12; border: 1px solid var(--border-color); border-radius: 8px; overflow: hidden; }
        .version-header { padding: 12px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; background: #111827; font-size: 13px; font-weight: 600; color: var(--accent-cyan); }
        .version-body { padding: 12px; font-size: 12px; color: var(--text-secondary); display: none; white-space: pre-line; border-top: 1px solid var(--border-color); }
        
        .progress-container { display: none; margin-top: 20px; background: #030712; padding: 16px; border-radius: 8px; border: 1px solid var(--border-color); }
        .progress-bar-bg { background: #1f2937; border-radius: 99px; height: 6px; width: 100%; overflow: hidden; }
        .progress-bar-fill { background: var(--border-focus); width: 0%; height: 100%; transition: width 0.1s linear; }
        .status-text { font-size: 11px; margin-top: 10px; color: var(--text-muted); font-family: monospace; }
    </style>
</head>
<body>

<div class="terminal-container">
    <div class="logo-wrapper"><img src="pulsar-logo.png" alt="Logo"></div>
    <div class="header-group">
        <h1>ÇİFT PULSAR v2</h1>
        <p class="subtitle">BLE Firmware Güncelleme Terminali</p>
    </div>

    <button class="btn" id="connBtn" onclick="initBluetooth()">Cihaza Bağlan</button>

    <div class="drop-zone" onclick="document.getElementById('fileInp').click()">
        <span id="fileTxt" class="drop-zone-text">Firmware (.bin) dosyasını seçin</span>
        <input type="file" id="fileInp" accept=".bin" onchange="onFileSelect()">
    </div>

    <div class="version-menu" id="versionMenu">
        <div class="version-header" onclick="toggleDetails()">
            <span id="vTitle">Sürüm Bilgileri Yükleniyor...</span>
            <span>▼</span>
        </div>
        <div class="version-body" id="vBody"></div>
    </div>

    <button class="btn btn-trigger" id="upBtn" onclick="pushUpdate()" style="display: none;">GÜNCELLEMEYİ BAŞLAT</button>

    <div class="progress-container" id="progBox">
        <div class="progress-bar-bg"><div class="progress-bar-fill" id="bar"></div></div>
        <div id="status" class="status-text">Bağlantı kararlı, dosya bekleniyor...</div>
    </div>
</div>

<script>
    const S_UUID = "4fafc201-1fb5-459e-8fcc-c5c9c331914b";
    const C_DATA = "beb5483e-36e1-4688-b7f5-ea07361b26a8";
    const C_CTRL = "e32ee5ee-ca2a-4124-a69c-f9964ca72412";
    let device = null, dChar = null, cChar = null, file = null;

    function toggleDetails() {
        const b = document.getElementById('vBody');
        b.style.display = (b.style.display === 'block') ? 'none' : 'block';
    }

    async function onFileSelect() {
        const inp = document.getElementById('fileInp');
        if(inp.files.length > 0) {
            file = inp.files[0];
            document.getElementById('fileTxt').innerText = `${file.name} [${Math.round(file.size/1024)} KB]`;
            
            // Buraya kendi Pastebin RAW linkini yapıştır
            const pastebinRawUrl = "https://pastebin.com/raw/SENIN_PASTE_IDN";
